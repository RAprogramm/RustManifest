version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      ra-ap:
        patterns:
          - "ra_ap_*"
      rmcp-tokio:
        patterns:
          - "rmcp"
          - "tokio"
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly