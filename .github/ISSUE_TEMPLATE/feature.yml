name: Feature request
description: Propose a non-rule addition or enhancement (CLI flag, MCP tool, integration, output format).
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve. Concrete user scenario, not a wishlist.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Sketch of the change. API, flag, behavior. Reference docs/RFCS if applicable.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This will need an RFC under `docs/RFCS/`.
        - label: This affects rules or schemas (rule proposal template is more appropriate).
