[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.92

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
deny = [
    { crate = "mockall", reason = "tests use hand-written fakes with real behavior, not generated mocks (STRUCTURE.md section 9)" },
    { crate = "mockito", reason = "tests use hand-written fakes with real behavior, not generated mocks (STRUCTURE.md section 9)" },
    { crate = "mockiato", reason = "tests use hand-written fakes with real behavior, not generated mocks (STRUCTURE.md section 9)" },
]
skip = [
    { crate = "syn@2", reason = "async-trait and tokio-macros moved to syn 3 while the wider proc-macro ecosystem is still on syn 2; both are needed until the migration completes" },
]
skip-tree = [
    { crate = "getrandom@0.3", reason = "rand_core 0.9 (via tsetlin-rs) pins getrandom 0.3 while tempfile is on 0.4; the subtree drags duplicate r-efi and wasi shims" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
