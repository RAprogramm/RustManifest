[package]
name = "rustmanifest-rules-core"
description = "Default rules pack for rustmanifest, parsed from the EN methodology and bundled with fixtures."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
categories = ["development-tools"]
keywords = ["rust", "lint", "code-review", "rules"]
build = "build.rs"
include = [
    "src/**/*",
    "rules/**/*",
    "build.rs",
    "Cargo.toml",
    "README.md",
]

[dependencies]
regex = { workspace = true }
rustmanifest-schema = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
rustmanifest-schema = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
