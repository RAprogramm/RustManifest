id = "RM-RUST-001"
severity = "error"
title = "Panic in production code"
rationale-uri = "rustmanifest://methodology/rust-specific#panic-in-production"

[definition.pattern]
regex = "\\.unwrap\\(\\)|\\.expect\\(|panic!"
exclude-globs = ["**/tests/**", "**/*_test.rs", "**/test_*.rs", "**/benches/**"]
