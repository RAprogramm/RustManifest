id = "RM-SEC-002"
severity = "error"
title = "SQL injection via format!"
rationale-uri = "rustmanifest://methodology/security-vulnerabilities#sql-injection"

[definition.pattern]
regex = "format!.*SELECT|execute.*&format!"
exclude-globs = ["**/tests/**", "**/*_test.rs", "**/test_*.rs"]
