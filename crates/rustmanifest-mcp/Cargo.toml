[package]
name = "rustmanifest-mcp"
description = "MCP server exposing the rustmanifest engine as tools, resources, and prompts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
categories = ["development-tools"]
keywords = ["rust", "mcp", "lint", "ai", "server"]

[[bin]]
name = "rustmanifest-mcp"
path = "src/main.rs"

[dependencies]
masterror = { workspace = true }
rustmanifest-schema = { workspace = true }
rustmanifest-engine = { workspace = true }
rustmanifest-learn = { workspace = true }
rustmanifest-rules-core = { workspace = true }
rmcp = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
rustmanifest-engine = { workspace = true }
rustmanifest-fixture = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
