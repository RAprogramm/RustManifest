[package]
name = "rustmanifest-eval"
description = "Evaluation harness for the rustmanifest engine: pinned corpus runs, committed baselines, and performance budgets."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
categories = ["development-tools"]
keywords = ["rust", "lint", "eval", "benchmark"]

[lib]
name = "rustmanifest_eval"
path = "src/lib.rs"

[[bin]]
name = "rustmanifest-eval"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
rustmanifest-engine = { workspace = true }
rustmanifest-rules-core = { workspace = true }
rustmanifest-schema = { workspace = true }
serde = { workspace = true }
syn = { workspace = true }
serde_json = { workspace = true }
masterror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
